# render.yaml
services:
  - type: web
    name: buytovar-web
    runtime: python
    buildCommand: |
      pip install -r requirements.txt
      python manage.py collectstatic --noinput
      python manage.py migrate --noinput
    startCommand: gunicorn buytovar.wsgi:application --bind 0.0.0.0:$PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: buytovar-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: "buytovar-web.onrender.com,localhost,127.0.0.1"
      - key: PYTHON_VERSION
        value: "3.10"
      - key: WEB_CONCURRENCY
        value: "4"
    
  - type: worker
    name: buytovar-vk-bot
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python manage.py run_vk_bot
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: buytovar-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"

databases:
  - name: buytovar-db
    databaseName: buytovar_db
    user: buytovar_user
    plan: free